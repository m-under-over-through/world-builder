# Netlify site configuration (ADR 0011). The client is static files under apps/web/public; the API
# is a Netlify Function on the same hostname (netlify/functions/api.mts). The publish folder
# is built by Vite. The build first applies migrations and loads the workshop folders into the
# context's database (DATABASE_URL), so no connection string ever touches a laptop. Security headers and redirects live in apps/web/public and are copied into dist/.

[build]
  publish = "apps/web/dist"
  command = "node tools/ops/migrate.ts && node tools/workshop/sync.ts && npm run build --workspace=apps/web"

[build.environment]
  NODE_VERSION = "24"

# Which public key the client seals to, per deploy context (ADR 0003, ADR 0011):
# production builds use workshop.json, branch deploys and previews use workshop.staging.json.
[context.production.environment]
  VITE_WB_ENV = "production"

[context.branch-deploy.environment]
  VITE_WB_ENV = "staging"

[context.deploy-preview.environment]
  VITE_WB_ENV = "staging"
