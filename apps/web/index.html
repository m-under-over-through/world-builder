<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4F3EF" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>World Builder</title>
  </head>
  <body>
    <!-- The page's own first screen (ADR 0028; src/lib/boot.ts): the same picture as the app's
         loading screen, the name where the header draws it and "Loading" under it, and a second
         line that shows after fifteen seconds (app.css). The two lines are the texts of "loading"
         under "App labels" and of CLIENT_NOT_STARTED in every workshop's copy.md; a test holds
         them equal. -->
    <div id="app">
      <div class="app boot">
        <header class="topbar">
          <div class="lines"><span class="name">World Builder</span></div>
        </header>
        <main class="text">
          <p class="muted">Loading…</p>
          <p class="muted late">
            This is taking longer than it should. If it stays like this, reload the page or open
            your link again.
          </p>
        </main>
      </div>
    </div>
    <script async src="/boot.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
