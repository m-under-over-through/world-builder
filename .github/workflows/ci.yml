name: CI

# Runs on every push and pull request: type check, tests, formatting, and an audit of the
# dependencies that are deployed. Nothing here touches secrets or deploys; deploy workflows live
# in the private ops repository, and so does the weekly scan of the live site.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      # What ships is the client bundle and the function bundle, built from the non-development
      # dependencies; a high or critical advisory in one of them blocks the merge. The development
      # tools (the test runner, the bundler, the migration generator) are audited by hand from
      # `npm audit` and by Dependabot's alerts, and upgraded on a schedule: a breaking upgrade of
      # the test runner should not block a fix to the app (ops runbook page `runbook/scans.md`).
      # The audit asks the npm registry; a registry outage fails this step with a network error,
      # and the fix is to rerun the job, not to change anything.
      - run: npm audit --omit=dev --audit-level=high
